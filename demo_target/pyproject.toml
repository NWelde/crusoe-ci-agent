[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-demo-math"
version = "0.1.0"
description = "Small deterministic package for CI workflow experiments"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
