name: Demo target CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: python -m pip install -e '.[test]'
      - name: Run required tests
        run: python -m pytest -q
