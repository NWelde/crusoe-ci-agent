[project]
name = "crusoe-ci-agent"
version = "0.1.0"
description = "Evidence-backed CI improvement agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "pydantic>=2", "requests>=2.32", "pyyaml>=6", "networkx>=3", "python-dotenv>=1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ci-agent = "ci_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
